<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATP Chart Desk</title>
<style>
:root{--bg:#0b0f0d;--panel:#111714;--panel2:#161e1a;--line:#1f2a25;--fg:#dfe9e4;--mute:#8a9d94;--accent:#2fd28a;--accent-ink:#04140c;--red:#ef5a5a;--amber:#f0b429;--blue:#5aa9ef;--violet:#a78bfa}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:6px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.brand small{color:var(--mute);font-weight:500}
input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 9px;width:96px;font:600 13px/1 ui-monospace,Consolas,monospace;text-transform:uppercase}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:500 13px/1 inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary{border-color:var(--accent);color:var(--accent)}
.group{display:flex;gap:4px;flex-wrap:wrap}
.status{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.live{background:var(--accent)}.dot.warn{background:var(--amber)}
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
#chartWrap{position:relative;min-height:0;min-width:0}
#chart{position:absolute;inset:0}
#zones{position:absolute;inset:0;pointer-events:none;z-index:2;width:100%;height:100%}
#title{position:absolute;left:12px;top:8px;z-index:3;pointer-events:none}
#title b{font:700 18px/1.2 ui-monospace,Consolas,monospace}
#title span{color:var(--mute);font-size:12px;margin-left:8px}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11px;color:var(--mute)}#legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}
.sug{border:1px dashed var(--mute);border-radius:8px;padding:4px 8px;margin-bottom:8px}.sug .keep{border-color:var(--accent);color:var(--accent)}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px 0;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);background:none;font-weight:600}
.pane{overflow:auto;padding:14px;flex:1;min-height:0}
.pane h1{font-size:15px;margin:0 0 6px}.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px}
.pane ul{margin:0;padding-left:18px}.pane li{margin:3px 0}
.pane em{color:var(--mute)}
.mark{display:grid;grid-template-columns:10px 1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mark i{width:10px;height:10px;border-radius:2px}
.mark code{font:12px ui-monospace,Consolas,monospace;color:var(--mute)}
.mark button{padding:2px 7px;font-size:12px}
.src{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.src.ai{color:var(--accent);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:5px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-family:ui-monospace,Consolas,monospace}
.empty{color:var(--mute)}
.hint{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--mute);margin-top:12px}
.hint code{color:var(--fg)}
footer{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;padding:7px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);background:var(--panel)}
footer a{color:var(--mute)}
#err{color:var(--amber)}
@media (max-width:820px){.status{display:none}.app{overflow-x:hidden}main{grid-template-columns:minmax(0,1fr);grid-template-rows:60vh auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>ATP Chart Desk <small>v0.1</small></div>
    <input id="sym" value="SPY" spellcheck="false" aria-label="Symbol">
    <div class="group" id="watch"></div>
    <div class="group" id="tfs"></div>
    <button class="primary" id="auto" title="Draw prior-day, premarket, gap, VWAP, FVG and swing zones">Mark levels</button>
    <div class="status"><span class="dot" id="dot"></span><span id="feed">…</span></div>
  </header>
  <main>
    <div id="chartWrap"><div id="chart"></div><canvas id="zones"></canvas><div id="title"><b id="tSym">SPY</b><span id="tInfo"></span><div id="legend"></div></div></div>
    <aside>
      <div class="tabs"><button data-tab="brief" class="on">Brief</button><button data-tab="marks">Marks</button><button data-tab="levels">Levels</button></div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
  <footer>
    <span>Education only, not financial advice. Trading involves risk. Your data stays on this computer.</span>
    <span id="err"></span>
    <span>Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a> · Alpha Trading Pros</span>
  </footer>
</div>
<script src="/vendor/lightweight-charts.js"></script>
<script>
const COLORS = {'prior-high':'#5aa9ef','prior-low':'#5aa9ef','prior-close':'#8a9d94','premarket-high':'#a78bfa','premarket-low':'#a78bfa',vwap:'#f0b429',open:'#dfe9e4',
  support:'#2fd28a',resistance:'#ef5a5a',gap:'#f0b429','fvg-bull':'#2fd28a','fvg-bear':'#ef5a5a',target:'#5aa9ef',invalidation:'#ef5a5a',custom:'#dfe9e4'};
const colorOf = d => d.color || COLORS[d.kind] || '#dfe9e4';
const $ = id => document.getElementById(id);
const S = { symbol: 'SPY', tf: '5m', bars: [], drawings: [], lines: [], tab: 'brief' };

const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true,
  layout: { background: { type: 'solid', color: '#0b0f0d' }, textColor: '#8a9d94', fontFamily: 'Inter, system-ui, sans-serif' },
  grid: { vertLines: { color: '#141c18' }, horzLines: { color: '#141c18' } },
  rightPriceScale: { borderColor: '#1f2a25' }, timeScale: { borderColor: '#1f2a25', timeVisible: true, secondsVisible: false, rightOffset: 8 },
  crosshair: { mode: 0, vertLine: { color: '#3a4a43', labelBackgroundColor: '#1f2a25' }, horzLine: { color: '#3a4a43', labelBackgroundColor: '#1f2a25' } },
  watermark: { visible: true, text: '', fontSize: 64, color: 'rgba(223,233,228,0.04)', fontFamily: 'Inter, system-ui, sans-serif', fontStyle: '700' },
});
const candles = chart.addCandlestickSeries({ upColor: '#2fd28a', downColor: '#ef5a5a', borderVisible: false, wickUpColor: '#2fd28a', wickDownColor: '#ef5a5a' });
const volume = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false });
const volAvg = chart.addLineSeries({ priceScaleId: 'vol', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
const IND = { series: new Map(), data: null };

const api = async (path, opts) => { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
const showErr = m => { $('err').textContent = m || ''; };

function idxAtOrAfter(t) { const b = S.bars; let lo = 0, hi = b.length - 1; if (t == null || !b.length) return 0; if (t > b[hi].time) return hi; while (lo < hi) { const m = (lo + hi) >> 1; if (b[m].time < t) lo = m + 1; else hi = m; } return lo; }

async function loadBars(fit) {
  const r = await api('/api/bars?symbol=' + encodeURIComponent(S.symbol) + '&tf=' + S.tf);
  S.bars = r.bars;
  candles.setData(r.bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  chart.applyOptions({ watermark: { text: r.symbol } });
  await loadIndicators();
  if (fit) { const n = r.bars.length; chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - (S.tf === '1d' ? 130 : 160)), to: n + 8 }); }
  const last = r.bars[r.bars.length - 1];
  $('tSym').textContent = r.symbol;
  $('tInfo').textContent = S.tf + (last ? ' · last ' + last.close.toFixed(2) : '') + (r.stale ? ' · offline copy' : '');
  $('dot').className = 'dot ' + (r.stale ? 'warn' : 'live');
  showErr(r.stale ? r.error : '');
}

async function loadIndicators() {
  const r = await api('/api/indicators?symbol=' + encodeURIComponent(S.symbol) + '&tf=' + S.tf);
  const v = r.volume;
  if (v) {
    const avg = new Map(v.avg.map(p => [p.time, p.value]));
    volume.setData(S.bars.map(b => {
      const a = avg.get(b.time), hot = v.highlightAbove && a && b.volume > a;
      return { time: b.time, value: b.volume, color: hot ? (v.highlightColor || '#f2f5f4') + 'cc' : b.close >= b.open ? 'rgba(47,210,138,.28)' : 'rgba(239,90,90,.28)' };
    }));
    volAvg.applyOptions({ color: (v.avgColor || '#f2f5f4') + '88', visible: v.showAverage !== false });
    volAvg.setData(v.avg);
  } else { volume.setData([]); volAvg.setData([]); }
  const seen = new Set();
  for (const l of r.lines) {
    seen.add(l.key);
    let s = IND.series.get(l.key);
    const opts = { color: l.color, lineWidth: l.width || 1, priceScaleId: l.pane === 'lower' ? 'lower' : 'right' };
    if (!s) { s = chart.addLineSeries({ ...opts, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }); IND.series.set(l.key, s); }
    else s.applyOptions(opts);
    s.setData(l.points);
    for (const g of s._guides || []) s.removePriceLine(g);
    s._guides = (l.guides || []).map(price => s.createPriceLine({ price, color: '#3a4a43', lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
  }
  for (const [k, s] of IND.series) if (!seen.has(k)) { chart.removeSeries(s); IND.series.delete(k); }
  const lower = r.lines.some(l => l.pane === 'lower');
  candles.priceScale().applyOptions({ scaleMargins: lower ? { top: 0.06, bottom: 0.36 } : { top: 0.06, bottom: 0.2 } });
  if (lower) chart.priceScale('lower').applyOptions({ scaleMargins: { top: 0.68, bottom: 0.17 } });
  const legend = [...r.lines.filter(l => l.label).map(l => '<span><i style="background:' + esc(l.color) + '"></i>' + esc(l.label) + '</span>')];
  if (v) legend.push('<span><i style="background:' + esc(v.highlightColor || '#f2f5f4') + '"></i>Vol &gt; ' + (v.avgLength || 20) + '-bar avg</span>');
  $('legend').innerHTML = legend.join('');
  if (r.errors.length) showErr('Indicator problem: ' + r.errors.join('; '));
}

async function loadDrawings() {
  S.drawings = await api('/api/drawings?symbol=' + encodeURIComponent(S.symbol));
  for (const l of S.lines) candles.removePriceLine(l);
  S.lines = S.drawings.filter(d => d.type === 'level').map(d => { const sg = d.status === 'suggested'; return candles.createPriceLine({ price: d.price, color: sg ? colorOf(d) + '99' : colorOf(d), lineWidth: d.source === 'ai' && !sg ? 2 : 1, lineStyle: sg ? 1 : d.source === 'ai' ? 0 : 2, axisLabelVisible: true, title: (sg ? '? ' : '') + d.label }); });
  const markers = S.drawings.filter(d => d.type === 'note' && S.bars.length).map(d => {
    const b = S.bars[idxAtOrAfter(d.time)];
    return { time: b.time, position: d.position === 'below' ? 'belowBar' : 'aboveBar', color: '#2fd28a', shape: d.position === 'below' ? 'arrowUp' : 'arrowDown', text: d.label };
  }).sort((a, b) => a.time - b.time);
  candles.setMarkers(markers);
  if (S.tab === 'marks') renderMarks();
}

// Zones are drawn on a canvas over the chart and kept in step with every pan and zoom.
const cv = $('zones'), ctx = cv.getContext('2d');
function drawZones() {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  if (!S.bars.length) return requestAnimationFrame(drawZones);
  const right = w - chart.priceScale('right').width();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, right, h); ctx.clip();
  ctx.font = '600 11px Inter, system-ui, sans-serif';
  for (const z of S.drawings.filter(d => d.type === 'zone')) {
    const y1 = candles.priceToCoordinate(z.top), y2 = candles.priceToCoordinate(z.bottom);
    if (y1 == null || y2 == null) continue;
    const x0 = z.from != null ? chart.timeScale().logicalToCoordinate(idxAtOrAfter(z.from)) : 0;
    const x = Math.max(0, x0 ?? 0), top = Math.min(y1, y2), hgt = Math.max(2, Math.abs(y2 - y1));
    const c = colorOf(z);
    const sg = z.status === 'suggested';
    ctx.globalAlpha = sg ? 0.06 : z.source === 'ai' ? 0.2 : 0.12; ctx.fillStyle = c; ctx.fillRect(x, top, right - x, hgt);
    ctx.globalAlpha = sg ? 0.6 : 0.7; ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.setLineDash(sg ? [2, 3] : z.source === 'ai' ? [] : [4, 3]);
    ctx.strokeRect(x + 0.5, top + 0.5, right - x - 1, hgt - 1);
    ctx.globalAlpha = 0.95; ctx.fillStyle = c; ctx.fillText((sg ? '? ' : '') + (z.label || ''), Math.max(x + 6, 8), hgt > 40 ? top + hgt - 6 : hgt < 16 ? top - 4 : top + 13);
  }
  ctx.restore();
  requestAnimationFrame(drawZones);
}
requestAnimationFrame(drawZones);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])_(.+?)_/g, '$1<em>$2</em>');
  let out = '', list = false;
  for (const line of src.split('\n')) {
    const li = /^\s*[-*] (.*)/.exec(line);
    if (li) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    if (line.startsWith('## ')) out += '<h2>' + inline(line.slice(3)) + '</h2>';
    else if (line.startsWith('# ')) out += '<h1>' + inline(line.slice(2)) + '</h1>';
    else if (line.trim()) out += '<p>' + inline(line) + '</p>';
  }
  return out + (list ? '</ul>' : '');
}

async function renderBrief() {
  const b = await api('/api/brief');
  $('pane').innerHTML = b.markdown
    ? (b.kind === 'facts' ? '<p class="src">Facts only · ask your AI to write the brief</p>' : '<p class="src ai">Written by your AI</p>') + (b.old ? '<p class="empty">Latest brief is from ' + esc(b.date) + '.</p>' : '') + md(b.markdown)
    : '<p class="empty">No brief yet.</p><div class="hint">Run <code>npm run brief</code> for the facts, then ask Claude or Codex: <code>write my morning brief</code>. To have it ready every weekday at 8:30, see SETUP.md.</div>';
}
function renderMarks() {
  const d = S.drawings;
  if (!d.length) { $('pane').innerHTML = '<p class="empty">Nothing drawn on ' + esc(S.symbol) + ' yet.</p><div class="hint">Press <b>Mark levels</b>, or ask your AI: <code>mark SPY using my rules</code>.</div>'; return; }
  const row = m => '<div class="mark"><i style="background:' + esc(colorOf(m)) + '"></i><span>' + esc(m.label || m.type) + ' <span class="src ' + (m.source === 'ai' ? 'ai' : '') + '">' + (m.source === 'ai' ? 'AI' : m.source) + '</span></span><code>' + (m.type === 'zone' ? m.bottom + '–' + m.top : m.type === 'level' ? m.price : 'note') + '</code><button data-del="' + esc(m.id) + '" aria-label="Remove">×</button></div>';
  const sugs = d.filter(m => m.status === 'suggested'), rest = d.filter(m => m.status !== 'suggested');
  $('pane').innerHTML = (sugs.length ? '<h2>Suggested by your AI</h2>' + sugs.map(m => '<div class="sug">' + row(m).replace('<button data-del', '<button class="keep" data-keep="' + esc(m.id) + '">Keep</button><button data-del') + '</div>').join('') + '<h2>On the chart</h2>' : '') + [...rest].sort((a, b) => (a.source === 'ai' ? -1 : 0) - (b.source === 'ai' ? -1 : 0)).map(row).join('');
}
async function renderLevels() {
  $('pane').innerHTML = '<p class="empty">Calculating…</p>';
  const L = await api('/api/levels?symbol=' + encodeURIComponent(S.symbol));
  const rows = [['Session', L.session], ['Last', L.last], ['ATR (14 day)', L.atr]];
  if (L.prior) rows.push(['Prior day high', L.prior.high], ['Prior day low', L.prior.low], ['Prior close', L.prior.close]);
  if (L.premarket) rows.push(['Premarket high', L.premarket.high], ['Premarket low', L.premarket.low]);
  if (L.open != null) rows.push(['Open', L.open]);
  if (L.vwap != null) rows.push(['VWAP', L.vwap]);
  if (L.gap) rows.push(['Gap ' + L.gap.direction + (L.gap.filled ? ' (filled)' : ''), L.gap.size + ' (' + L.gap.pct + '%)']);
  $('pane').innerHTML = '<table>' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1] ?? '–') + '</td></tr>').join('') + '</table>'
    + '<h2>Unfilled 15m fair value gaps</h2>' + (L.fvgs.length ? '<ul>' + L.fvgs.map(f => '<li>' + (f.dir === 'bull' ? '↑ ' : '↓ ') + f.bottom + '–' + f.top + '</li>').join('') + '</ul>' : '<p class="empty">None.</p>')
    + '<h2>Daily swing zones</h2>' + (L.zones.length ? '<ul>' + L.zones.map(z => '<li>' + (z.kind === 'support' ? 'Support ' : 'Resistance ') + z.bottom + '–' + z.top + ' · ' + z.touches + ' touches</li>').join('') + '</ul>' : '<p class="empty">None.</p>')
    + '<div class="hint">Calculated by code, not predicted. Your AI reads these with <code>chart_levels</code> and decides what matters using <code>my-rules.md</code>.</div>';
}
const renderTab = () => (S.tab === 'brief' ? renderBrief() : S.tab === 'marks' ? renderMarks() : renderLevels()).catch(e => { $('pane').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });

async function open(symbol, tf) {
  S.symbol = symbol.toUpperCase(); if (tf) S.tf = tf; $('sym').value = S.symbol;
  document.querySelectorAll('#tfs button').forEach(b => b.classList.toggle('on', b.dataset.tf === S.tf));
  document.querySelectorAll('#watch button').forEach(b => b.classList.toggle('on', b.textContent === S.symbol));
  try { await loadBars(true); await loadDrawings(); if (S.tab !== 'brief') renderTab(); } catch (e) { showErr(e.message); $('dot').className = 'dot warn'; }
}

['5m', '15m', '1h', '1d'].forEach(tf => { const b = document.createElement('button'); b.textContent = tf.toUpperCase(); b.dataset.tf = tf; b.onclick = () => open(S.symbol, tf); $('tfs').append(b); });
$('sym').addEventListener('keydown', e => { if (e.key === 'Enter') open(e.target.value.trim() || 'SPY'); });
$('auto').onclick = async () => { $('auto').textContent = 'Marking…'; try { await api('/api/auto?symbol=' + encodeURIComponent(S.symbol), { method: 'POST' }); await loadDrawings(); } catch (e) { showErr(e.message); } $('auto').textContent = 'Mark levels'; };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); S.tab = b.dataset.tab; renderTab(); });
$('pane').addEventListener('click', async e => {
  const keep = e.target.dataset?.keep, del = e.target.dataset?.del;
  if (keep) await api('/api/drawings/accept?symbol=' + encodeURIComponent(S.symbol) + '&id=' + keep, { method: 'POST' });
  else if (del) await api('/api/drawings?symbol=' + encodeURIComponent(S.symbol) + '&id=' + del, { method: 'DELETE' });
  else return;
  await loadDrawings();
});

const live = !new URLSearchParams(location.search).has('snapshot');
const ev = live ? new EventSource('/api/events') : {};
ev.onmessage = async m => {
  const { what } = JSON.parse(m.data);
  if (what === 'drawings') loadDrawings().catch(() => {});
  if (what === 'indicators') loadIndicators().catch(e => showErr(e.message));
  if (what === 'brief' && S.tab === 'brief') renderBrief();
  if (what === 'state') { const c = await api('/api/config'); if (c.state?.symbol) open(c.state.symbol, c.state.tf); }
};
if (live) setInterval(() => { if (!document.hidden && S.tf !== '1d') loadBars(false).catch(() => {}); }, 30000);

(async () => {
  const c = await api('/api/config');
  $('feed').textContent = c.provider.label;
  for (const s of c.watchlist) { const b = document.createElement('button'); b.textContent = s; b.onclick = () => open(s); $('watch').append(b); }
  const q = new URLSearchParams(location.search);
  await open(q.get('symbol') || c.state?.symbol || c.watchlist[0] || 'SPY', q.get('tf') || c.state?.tf || '5m');
  renderTab();
})();
</script>
</body>
</html>
